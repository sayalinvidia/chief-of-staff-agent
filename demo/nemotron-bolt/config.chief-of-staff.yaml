model:
  default: nemotron-3.5-bolt
  provider: custom
  base_url: http://127.0.0.1:8080/v1
  context_length: 65536
providers:
  local-qwen:
    base_url: http://127.0.0.1:8080/v1
    extra_body:
      temperature: 0.6
terminal:
  shell_init_files:
    - C:\Users\NVIDIA\AppData\Local\hermes-channel-build-nvidia-local-offer\profiles\chief-of-staff\shell-init.sh
platform_toolsets:
  cli:
    - skills
    - terminal
    - cronjob
  cron:
    - skills
    - terminal
agent:
  disabled_toolsets:
    - desktop_ui
  max_turns: 40
memory:
  memory_enabled: false
  user_profile_enabled: false
  memory_char_limit: 0
  user_char_limit: 0
  nudge_interval: 0
auxiliary:
  title_generation:
    enabled: false
    model_upgrade_enabled: false
  background_review:
    enabled: false
curator:
  enabled: false
_config_version: 46
skills:
  creation_nudge_interval: 0
  auto_load:
    - chief-of-staff
  disabled:
    - airtable
    - apple-notes
    - apple-reminders
    - architecture-diagram
    - arxiv
    - ascii-video
    - baoyu-infographic
    - blocked-page-recovery
    - box
