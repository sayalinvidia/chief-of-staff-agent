    - claude-design
    - codebase-inspection
    - codex
    - competitor-news-monitor
    - computer-use
    - design-md
    - document-to-action-items
    - docx
    - dogfood
    - email-inbox-triage
    - findmy
    - gif-search
    - github
    - grounded-citations
    - hermes-agent
    - hermes-agent-skill-authoring
    - himalaya
    - humanizer
    - imessage
    - inspecting-hermes-desktop-dom
    - llm-wiki
    - manim-video
    - maps
    - meeting-action-items
    - node-inspect-debugger
    - notion
    - obsidian
    - opencode
    - p5js
    - pdf
    - popular-web-designs
    - powerpoint
    - product-price-monitor
    - python-debugpy
    - requesting-code-review
    - sdlc-review
    - simplify-code
    - songsee
    - songwriting-and-ai-music
